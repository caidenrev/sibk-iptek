<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007373">
<title>Sedang offline · SIBK</title>
<style>
  :root { --bg: #f5f9f9; --fg: #0f2a2e; --muted: #4f6266; --teal: #007373; --on-teal: #ffffff; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c1518; --fg: #e9f0f0; --muted: #98a9ac; --teal: #4ab9b2; --on-teal: #0c1518; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; line-height: 1.5;
    padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left));
  }
  main { max-width: 22rem; text-align: center; display: grid; gap: 12px; justify-items: center; }
  .tile { width: 56px; height: 56px; border-radius: 16px; background: #007373; display: grid; place-items: center; margin-bottom: 8px; }
  h1 { font-size: 22px; margin: 0; text-wrap: balance; }
  p { margin: 0; color: var(--muted); }
  button {
    margin-top: 12px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; font: inherit; font-weight: 600;
    background: var(--teal); color: var(--on-teal); cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <span class="tile" aria-hidden="true">
    <svg width="34" height="34" viewBox="34 32 188 194"><path fill="#ffffff" d="M88.29 162.04A64 64 0 0 1 76.95 158L38.83 165.17L46 127.05A64 64 0 1 1 167.71 93.96A64 64 0 0 0 88.29 162.04Z"/><path fill="#A7E0DA" d="M167.71 93.96A64 64 0 0 1 210 183.05L217.17 221.17L179.05 214A64 64 0 0 1 88.29 162.04A64 64 0 0 0 167.71 93.96Z"/></svg>
  </span>
  <h1>Kamu sedang offline</h1>
  <p>SIBK butuh internet untuk membuka pengaduan dan jadwal. Periksa data seluler atau Wi-Fi, lalu coba lagi.</p>
  <button type="button" onclick="location.reload()">Coba lagi</button>
</main>
</body>
</html>
